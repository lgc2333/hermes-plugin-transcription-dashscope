name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install "ruff>=0.9"
      - name: Lint
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches pyproject's requires-python: >=3.11,<3.15.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      # The provider subclasses agent.transcription_provider, so the tests need Hermes' sources.
      HERMES_INSTALL_DIR: ${{ github.workspace }}/.hermes
      # Pinned to the release that exports TranscriptionStreamSession (the live-dictation ABC);
      # older tags satisfy the file-API only.
      HERMES_REF: v0.22.5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Hermes sources
        run: git clone --depth 1 --branch "$HERMES_REF" https://github.com/NousResearch/hermes-agent .hermes
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install test dependencies
        run: python -m pip install "dashscope>=2,<3" "pytest>=8" "websockets>=13"
      - name: Run tests
        run: python -m pytest

  upstream-head:
    # Not a merge gate: reports when Hermes' plugin API drifts under a new commit.
    name: test (Hermes main)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HERMES_INSTALL_DIR: ${{ github.workspace }}/.hermes
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Hermes sources (main)
        run: git clone --depth 1 https://github.com/NousResearch/hermes-agent .hermes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install test dependencies
        run: python -m pip install "dashscope>=2,<3" "pytest>=8" "websockets>=13"
      - name: Run tests
        run: python -m pytest
